<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Mandarin Flashcards App Icon</title>
  <desc id="desc">A layered flashcard icon with a large Chinese character on a blush gradient background.</desc>
  <defs>
    <linearGradient id="bgGradient" x1="64" y1="44" x2="444" y2="468" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffe1e7"/>
      <stop offset="0.52" stop-color="#ffbac9"/>
      <stop offset="1" stop-color="#f47c9f"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(396 104) rotate(123) scale(194)">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.92"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="frontCard" x1="122" y1="100" x2="390" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fffefe"/>
      <stop offset="1" stop-color="#fff3f7"/>
    </linearGradient>
    <linearGradient id="backCard" x1="90" y1="142" x2="354" y2="450" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.82"/>
      <stop offset="1" stop-color="#ffd9e4" stop-opacity="0.74"/>
    </linearGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#c94d79" flood-opacity="0.18"/>
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#ffffff" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="120" fill="url(#bgGradient)"/>
  <circle cx="396" cy="104" r="132" fill="url(#glow)" opacity="0.88"/>
  <path d="M32 404C110 346 192 332 278 362C342 384 402 382 480 326V512H32Z" fill="#ffffff" opacity="0.12"/>

  <g transform="translate(94 146) rotate(-8 143 152)" opacity="0.9">
    <rect x="0" y="0" width="286" height="304" rx="50" fill="url(#backCard)"/>
    <rect x="22" y="28" width="166" height="18" rx="9" fill="#ffffff" opacity="0.56"/>
  </g>

  <g filter="url(#cardShadow)">
    <rect x="122" y="100" width="268" height="320" rx="52" fill="url(#frontCard)"/>
    <rect x="122.75" y="100.75" width="266.5" height="318.5" rx="51.25" fill="none" stroke="#ffffff" stroke-opacity="0.78" stroke-width="1.5"/>

    <rect x="146" y="126" width="220" height="24" rx="12" fill="#f9dbe3"/>
    <rect x="156" y="131" width="38" height="14" rx="7" fill="#6ea1c6"/>
    <rect x="206" y="131" width="38" height="14" rx="7" fill="#fb923c"/>
    <rect x="256" y="131" width="38" height="14" rx="7" fill="#a855f7"/>
    <rect x="306" y="131" width="38" height="14" rx="7" fill="#6eaa73"/>

    <text
      x="256"
      y="288"
      text-anchor="middle"
      font-family="BiauKai, DFKai-SB, Kaiti TC, STKaiti, Noto Serif TC, serif"
      font-size="168"
      font-weight="400"
      fill="#d94f82"
    >字</text>

    <rect x="176" y="326" width="160" height="20" rx="10" fill="#f4c0ce"/>
    <rect x="194" y="358" width="124" height="15" rx="7.5" fill="#f8dee6"/>
  </g>

  <g transform="translate(384 124)">
    <circle cx="0" cy="0" r="22" fill="#ffffff" opacity="0.22"/>
    <path d="M0-14 3-4 14 0 3 4 0 14-3 4-14 0-3-4Z" fill="#ffffff" opacity="0.92"/>
  </g>
</svg>
